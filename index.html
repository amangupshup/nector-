<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nector · Self-care, your way</title>
<meta name="description" content="Tell us a little about your self-care routine and discover your first nector treat.">
<meta name="theme-color" content="#F8F5EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F8F5EF'/%3E%3Cpath d='M16 7a9 9 0 1 0 9 9V7z' transform='rotate(45 16 16)' fill='%23A18B76'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F5EF;--cream:#F0E9DF;--ink:#45372F;--muted:#75614F;--taupe:#A18B76;--accent:#A7AE99;
  --card:#FFFFFF;--line:rgba(69,55,47,0.14);--ring:rgba(167,174,153,0.45);--error:#9A4A3A;--selBg:#F3EEE6;
  --serif:'Cormorant Garamond',serif;--sans:'DM Sans',system-ui,sans-serif;
  --r1:14px;--r2:22px;--rb:999px;
}
html,body{margin:0;padding:0;background:var(--bg);-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
body{min-height:100vh;color:var(--ink);font-family:var(--sans);}
button{font-family:inherit;color:inherit;}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
h1{outline:none;}

.eyebrow{font-size:12px;letter-spacing:0.22em;color:var(--muted);font-weight:500;}
.muted{color:var(--muted);}
.serif{font-family:var(--serif);font-weight:400;}
.serif em{font-style:italic;color:var(--taupe);}

/* Logo — "Nectar Drop" */
.logo{display:inline-flex;align-items:baseline;font-family:var(--serif);font-weight:500;letter-spacing:-0.01em;line-height:1;white-space:nowrap;}
.logo .drop{display:inline-block;width:0.36em;height:0.36em;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:var(--taupe);margin:0 0.07em 0 0.06em;}

/* Image slot */
.img{position:absolute;inset:0;border-radius:var(--r2);overflow:hidden;background:var(--cream);}
.img.sm{border-radius:var(--r1);}
.img img{width:100%;height:100%;object-fit:cover;display:block;}

/* Buttons */
.btn{min-height:56px;padding:0 36px;border-radius:var(--rb);border:none;background:var(--ink);color:var(--bg);font-size:16px;font-weight:500;letter-spacing:0.01em;cursor:pointer;box-shadow:0 10px 24px -14px rgba(40,28,20,0.6);transition:transform .2s;}
.btn:hover{transform:translateY(-1px);}
.btn-outline{min-height:52px;padding:0 30px;border-radius:var(--rb);border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;transition:background .25s,color .25s;}
.btn-outline.on{background:var(--ink);color:var(--bg);}
.link{background:none;border:none;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:40px;padding:0;}

/* Header */
header{position:sticky;top:0;z-index:5;background:var(--bg);}
.hdr{max-width:820px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:64px;}
.back{min-height:44px;display:inline-flex;align-items:center;background:none;border:none;font-size:14px;font-weight:500;cursor:pointer;padding:0 12px;border-radius:var(--rb);}
.back:hover{background:var(--cream);}
.steplbl{justify-self:end;font-size:12px;letter-spacing:0.14em;color:var(--muted);padding-right:8px;}
.bar{height:2px;background:var(--line);}
.bar>div{height:100%;background:var(--ink);transition:width .6s cubic-bezier(.2,.7,.2,1);}

/* Welcome */
.split{min-height:100vh;display:flex;}
.welcome{flex-wrap:wrap-reverse;}
.soon{flex-wrap:wrap;}
.split-copy{flex:1 1 420px;display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,7vw,96px) clamp(24px,6vw,88px);gap:28px;}
.split-media{flex:1 1 440px;min-height:48vh;position:relative;}
.soon .split-media{flex-basis:420px;min-height:42vh;}
.split-media>.frame{position:absolute;inset:clamp(12px,1.6vw,20px);}
.hero-h{margin:0;font-size:clamp(50px,8vw,98px);line-height:0.98;letter-spacing:-0.02em;}
.lede{margin:0;font-size:17px;line-height:1.6;color:var(--muted);max-width:30em;text-wrap:pretty;}
.pill{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--cream);border-radius:var(--r1);max-width:420px;font-size:15px;line-height:1.4;}
.diamond{width:8px;height:8px;background:var(--accent);transform:rotate(45deg);flex:none;}

/* Contact */
.narrow{max-width:540px;margin:0 auto;padding:clamp(32px,7vh,72px) 24px 64px;}
.h-q{margin:0 0 12px;font-size:clamp(36px,6vw,50px);line-height:1.08;letter-spacing:-0.015em;text-wrap:balance;}
form{display:flex;flex-direction:column;gap:22px;}
.field{display:flex;flex-direction:column;gap:8px;}
.field label{font-size:14px;font-weight:500;}
.input{height:56px;border-radius:var(--r1);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 18px;font-size:17px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
.input:focus{box-shadow:0 0 0 3px var(--ring);}
.phone{display:flex;height:56px;border-radius:var(--r1);border:1px solid var(--line);background:var(--card);overflow:hidden;transition:border-color .2s,box-shadow .2s;}
.phone:focus-within{box-shadow:0 0 0 3px var(--ring);}
.phone.bad{border-color:var(--error);}
.phone span{display:flex;align-items:center;padding:0 14px 0 18px;font-size:17px;color:var(--muted);border-right:1px solid var(--line);}
.phone input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);padding:0 16px;font-size:17px;font-family:inherit;outline:none;letter-spacing:0.04em;}
.err{font-size:13px;color:var(--error);}
.err:empty{display:none;}
.hint{font-size:13px;color:var(--muted);}
.consent{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r1);background:var(--cream);cursor:pointer;font-size:14px;line-height:1.5;}
.consent input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ink);cursor:pointer;}
.privacy-btn{align-self:flex-start;background:none;border:none;padding:6px 0;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px;}
.privacy{font-size:13px;line-height:1.6;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 14px;}
.submit{margin-top:6px;min-height:56px;border-radius:var(--rb);border:none;background:var(--ink);color:var(--bg);font-size:16px;font-weight:500;cursor:pointer;}

/* Branch */
.wide{max-width:860px;margin:0 auto;padding:clamp(28px,6vh,64px) 20px 64px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
.card{position:relative;text-align:left;padding:10px;border-radius:var(--r2);border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(40,28,20,0.04);transition:border-color .25s,box-shadow .25s,transform .25s;}
.card:hover{box-shadow:0 18px 40px -26px rgba(40,28,20,0.55);}
.card.on{border-color:var(--ink);box-shadow:0 22px 44px -28px rgba(40,28,20,0.6);transform:translateY(-2px);}
.card .media{position:relative;height:clamp(190px,32vh,300px);pointer-events:none;}
.card .txt{padding:20px 14px 14px;display:flex;flex-direction:column;gap:6px;}
.card .t{font-family:var(--serif);font-size:28px;line-height:1.1;}
.card .d{font-size:15px;color:var(--muted);line-height:1.5;}
.card .mk{position:absolute;top:22px;right:22px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--card);color:var(--bg);border:1.5px solid var(--taupe);transition:all .25s;}
.card.on .mk{background:var(--ink);border-color:var(--ink);}

/* Questions */
.qwrap{max-width:600px;margin:0 auto;padding:clamp(28px,6vh,60px) 20px 0;}
.h-qq{margin:0 0 10px;font-size:clamp(32px,5.4vw,46px);line-height:1.1;letter-spacing:-0.015em;text-wrap:balance;}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.opt{min-height:60px;padding:14px 16px 14px 18px;border-radius:var(--r1);border:1.5px solid var(--line);background:var(--card);text-align:left;font-size:15.5px;line-height:1.35;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;transition:border-color .2s,background .2s,transform .15s;}
.opt:hover{border-color:var(--taupe);}
.opt:active{transform:scale(0.985);}
.opt .mk{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--taupe);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;}
.opt.on{border-color:var(--ink);background:var(--selBg);}
.opt.on .mk{background:var(--ink);border-color:var(--ink);}
.qfoot{position:sticky;bottom:0;background:var(--bg);padding:20px 0 24px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}

/* Offer */
.offer{min-height:100vh;background:var(--cream);padding:20px 20px 32px;position:relative;overflow:hidden;}
.offer-in{max-width:560px;margin:0 auto;padding-top:clamp(12px,3vh,32px);text-align:center;position:relative;}
.petals{position:absolute;inset:0;pointer-events:none;}
.petals span{position:absolute;opacity:0;}
.offer-card{background:var(--card);border-radius:var(--r2);padding:10px 10px 28px;box-shadow:0 30px 60px -40px rgba(40,28,20,0.5);overflow:hidden;}
.code{background:var(--bg);border:1px dashed var(--taupe);border-radius:var(--r1);padding:16px 26px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.code b{font-size:clamp(24px,6vw,32px);font-weight:500;letter-spacing:0.22em;padding-left:0.22em;}
.chip{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:8px 14px;border-radius:var(--rb);background:var(--cream);font-size:12px;letter-spacing:0.2em;font-weight:500;}
.codebox{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px dashed var(--taupe);border-radius:var(--r1);max-width:420px;}

@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to take the nector survey.</p></noscript>

<script src="/questions.js"></script>
<script>
(function () {
  'use strict';
  const { QUESTIONS, BRANCH_STEPS, OFFER } = window.NECTOR;
  const CTA_URL = ''; // Optional: where "Discover your nector experience" goes. Empty = show "Coming soon".
  const PENDING_KEY = 'nector_pending_v1';

  const IMG = {
    hero: 'https://images.pexels.com/photos/4056460/pexels-photo-4056460.jpeg?auto=compress&cs=tinysrgb&w=1400',
    home: 'https://images.pexels.com/photos/4004470/pexels-photo-4004470.jpeg?auto=compress&cs=tinysrgb&w=1000',
    salon: 'https://images.pexels.com/photos/7750099/pexels-photo-7750099.jpeg?auto=compress&cs=tinysrgb&w=1000',
    gift: 'https://images.pexels.com/photos/5705991/pexels-photo-5705991.jpeg?auto=compress&cs=tinysrgb&w=1000',
    soon: 'https://images.pexels.com/photos/34939759/pexels-photo-34939759.jpeg?auto=compress&cs=tinysrgb&w=1400'
  };

  const PHONE_RE = /^[6-9]\d{9}$/;
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = sel => app.querySelector(sel);
  const app = document.getElementById('app');

  const fresh = () => ({ step: 'welcome', branch: null, firstName: '', phone: '', consent: false, phoneTouched: false, submitted: false, showPrivacy: false, answers: {}, completedAt: null, copied: false, codeCopied: false, responseId: uuid() });
  let S = fresh();
  let dir = 1, advT, copyT;

  // ---------- flow ----------
  const seq = () => ['welcome', 'contact', 'branch', ...BRANCH_STEPS[S.branch === 'salon' ? 'salon' : 'home'], 'offer', 'soon'];

  function go(step, d) {
    dir = d;
    clearTimeout(advT); clearTimeout(copyT);
    S.step = step; S.copied = false;
    if (step === 'offer' && !S.completedAt) {
      S.completedAt = new Date().toISOString();
      submit(buildResponse());
    }
    render();
  }
  const next = () => { const s = seq(), i = s.indexOf(S.step); if (i < s.length - 1) go(s[i + 1], 1); };
  const back = () => { const s = seq(), i = s.indexOf(S.step); if (i > 0) go(s[i - 1], -1); };
  const restart = () => { S = fresh(); dir = -1; clearTimeout(advT); clearTimeout(copyT); render(); };

  function phoneError() {
    return S.phone && !PHONE_RE.test(S.phone) ? "That doesn't look like a 10-digit Indian mobile number — fix it or leave it blank." : '';
  }

  // ---------- response + submission ----------
  function buildResponse() {
    const home = S.branch === 'home', salon = S.branch === 'salon', a = S.answers;
    const qs = new URLSearchParams(location.search);
    return {
      responseId: S.responseId,
      firstName: S.firstName.trim() || null,
      phone: PHONE_RE.test(S.phone) ? '+91' + S.phone : null,
      marketingConsent: S.consent,
      preferredExperience: S.branch,
      homeServicesUsed: home ? (a.homeServicesUsed || []) : null,
      homeServicePainPoint: home ? (a.homeServicePainPoint || []) : null,
      desiredAdditionalService: home ? (a.desiredAdditionalService || []) : null,
      salonVisitFrequency: salon ? (a.salonVisitFrequency || []) : null,
      salonPreferenceReason: salon ? (a.salonPreferenceReason || []) : null,
      homeConversionFactor: salon ? (a.homeConversionFactor || []) : null,
      servicesOpenToTryingAtHome: salon ? (a.servicesOpenToTryingAtHome || []) : null,
      completedAt: S.completedAt,
      offerCode: OFFER.code,
      utmSource: qs.get('utm_source'),
      utmMedium: qs.get('utm_medium'),
      utmCampaign: qs.get('utm_campaign')
    };
  }

  function readPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return []; } }
  function writePending(list) { try { list.length ? localStorage.setItem(PENDING_KEY, JSON.stringify(list)) : localStorage.removeItem(PENDING_KEY); } catch (e) {} }
  function queue(r) { const l = readPending().filter(x => x.responseId !== r.responseId); l.push(r); writePending(l); }
  function dequeue(id) { writePending(readPending().filter(x => x.responseId !== id)); }

  async function post(r) {
    const res = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r), keepalive: true });
    if (res.status >= 400 && res.status < 500) return true; // rejected as invalid — don't retry forever
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  }

  // Keep the response on the device until the server confirms it, so a flaky connection doesn't lose it.
  async function submit(r) {
    queue(r);
    for (let attempt = 0; attempt < 4; attempt++) {
      try { await post(r); dequeue(r.responseId); window.dispatchEvent(new CustomEvent('nector:complete', { detail: r })); return; }
      catch (e) { await new Promise(ok => setTimeout(ok, 800 * Math.pow(2, attempt))); }
    }
  }
  function flushPending() { readPending().forEach(r => { post(r).then(() => dequeue(r.responseId), () => {}); }); }

  // ---------- templates ----------
  const logo = px => `<span class="logo" role="img" aria-label="nector" style="font-size:${px}px">nect<span class="drop"></span>r</span>`;
  const img = (src, cls) => `<div class="img ${cls || ''}"><img src="${src}" alt="" loading="lazy" decoding="async"></div>`;

  function header() {
    const s = seq(), idx = s.indexOf(S.step), total = s.length - 3;
    if (!(idx > 0 && idx <= total)) return '';
    const pct = Math.round(idx / total * 100);
    return `<header>
      <div class="hdr">
        <div><button type="button" class="back" data-act="back" aria-label="Go back to the previous step">Back</button></div>
        ${logo(28)}
        <div class="steplbl" aria-label="Step ${idx} of ${total}">${pad(idx)} / ${pad(total)}</div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div style="width:${pct}%"></div></div>
    </header>`;
  }

  function vWelcome() {
    return `<section class="split welcome">
      <div class="split-copy">
        <div data-enter>${logo(36)}</div>
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div data-enter class="eyebrow">A LITTLE MORE YOU</div>
          <h1 data-enter class="serif hero-h">Self-care,<br><em>your way.</em></h1>
          <p data-enter class="lede">We're creating something special for women who love feeling their best, without the extra effort. Tell us a little about your routine and discover your first nector treat.</p>
        </div>
        <div data-enter class="pill"><span class="diamond"></span><span>A complimentary service awaits at the end.</span></div>
        <div data-enter style="display:flex;flex-wrap:wrap;align-items:center;gap:20px;">
          <button type="button" class="btn" data-act="begin">Let's begin</button>
          <span style="font-size:13px;color:var(--muted);letter-spacing:0.02em;">Takes less than 2 minutes</span>
        </div>
      </div>
      <div class="split-media"><div class="frame">${img(IMG.hero)}</div></div>
    </section>`;
  }

  function vContact() {
    return `<section class="narrow">
      <div class="eyebrow" style="margin-bottom:16px;">HELLO THERE</div>
      <h1 tabindex="-1" class="serif h-q">First, what should we call you?</h1>
      <p style="margin:0 0 36px;font-size:16px;color:var(--muted);line-height:1.6;">Your first nector experience starts here.</p>
      <form id="contact" novalidate>
        <div class="field">
          <label for="nector-name">First name</label>
          <input id="nector-name" class="input" type="text" autocomplete="given-name" maxlength="40" placeholder="e.g. Ananya" value="${esc(S.firstName)}">
        </div>
        <div class="field">
          <label for="nector-phone">Mobile number</label>
          <div class="phone" id="phone-box">
            <span aria-hidden="true">+91</span>
            <input id="nector-phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98765 43210" aria-describedby="nector-phone-err nector-phone-hint" aria-label="Mobile number, India +91" value="${esc(S.phone)}">
          </div>
          <div id="nector-phone-err" class="err" role="alert"></div>
          <div id="nector-phone-hint" class="hint">Add it if you'd like us to send your offer and tell you when we're live.</div>
        </div>
        <label for="nector-consent" class="consent">
          <input id="nector-consent" type="checkbox" ${S.consent ? 'checked' : ''}>
          <span>I'd like to receive my nector offer and occasional updates from nector on WhatsApp or SMS.</span>
        </label>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button type="button" class="privacy-btn" data-act="privacy" aria-expanded="${S.showPrivacy}" aria-controls="nector-privacy">${S.showPrivacy ? 'Hide privacy notice' : 'How we use your details'}</button>
          <div id="nector-privacy" class="privacy" ${S.showPrivacy ? '' : 'hidden'}>We use your name to personalise this experience and your number, if you share it, to send your nector offer. We'll only send updates if you tick the box above, and you can opt out any time. We never sell your details.</div>
        </div>
        <button type="submit" class="submit">Next</button>
      </form>
    </section>`;
  }

  function vBranch() {
    const name = S.firstName.trim();
    const card = (b, src, t, d) => `<button type="button" class="card ${S.branch === b ? 'on' : ''}" data-branch="${b}" aria-pressed="${S.branch === b}">
        <div class="media">${img(src, 'sm')}</div>
        <div class="txt"><div class="t">${t}</div><div class="d">${d}</div></div>
        <span class="mk" aria-hidden="true">${S.branch === b ? '✓' : ''}</span>
      </button>`;
    return `<section class="wide">
      <div class="eyebrow" style="margin-bottom:16px;text-align:center;">${esc(name ? 'NICE TO MEET YOU, ' + name.toUpperCase() : 'NICE TO MEET YOU')}</div>
      <h1 tabindex="-1" class="serif" style="margin:0 auto 36px;max-width:16em;text-align:center;font-size:clamp(32px,5.4vw,50px);line-height:1.1;letter-spacing:-0.015em;text-wrap:balance;">When it's time for a little self-care, what sounds more like you?</h1>
      <div class="cards">
        ${card('home', IMG.home, 'At home, please', 'Comfort, convenience, and no travel.')}
        ${card('salon', IMG.salon, 'The salon experience', 'A change of scene and some me-time.')}
      </div>
    </section>`;
  }

  function vQuestion(key) {
    const q = QUESTIONS[key];
    const val = S.answers[q.field] || [];
    return `<section class="qwrap">
      <div class="eyebrow" style="margin-bottom:16px;">${q.eyebrow}</div>
      <h1 tabindex="-1" class="serif h-qq">${esc(q.title)}</h1>
      <p style="margin:0 0 28px;font-size:15px;color:var(--muted);">${q.sub}</p>
      <div role="group" aria-label="${esc(q.title)}" class="opts">
        ${q.options.map(([id, label]) => {
          const on = val.includes(id);
          return `<button type="button" class="opt ${on ? 'on' : ''}" data-opt="${id}" aria-pressed="${on}"><span>${esc(label)}</span><span class="mk" aria-hidden="true">${on ? '✓' : ''}</span></button>`;
        }).join('')}
      </div>
      <div class="qfoot">
        <span id="qhint" style="font-size:13px;color:var(--muted);"></span>
        <button type="button" id="qnext" class="btn-outline" data-act="next">Next</button>
      </div>
    </section>`;
  }

  function vOffer() {
    const name = S.firstName.trim();
    const petals = [
      [8, 30, 8, '50%', 'accent'], [22, 22, 6, '0', 'taupe', 1], [36, 34, 5, '50%', 'ink'], [52, 24, 9, '50%', 'accent'],
      [66, 32, 6, '0', 'taupe', 1], [80, 22, 7, '50%', 'accent'], [92, 30, 5, '50%', 'taupe']
    ].map(([l, t, s, r, c, rot]) => `<span data-petal style="left:${l}%;top:${t}%;width:${s}px;height:${s}px;border-radius:${r};background:var(--${c});${rot ? 'transform:rotate(45deg);' : ''}"></span>`).join('');
    return `<section class="offer">
      <div style="display:flex;justify-content:center;">${logo(28)}</div>
      <div class="offer-in">
        <div class="petals" aria-hidden="true">${petals}</div>
        <div data-reveal class="eyebrow" style="margin-bottom:18px;">A THANK-YOU FROM NECTOR</div>
        <h1 data-reveal tabindex="-1" class="serif" style="margin:0 auto 12px;max-width:11em;font-size:clamp(32px,6vh,56px);line-height:1.02;letter-spacing:-0.02em;text-wrap:balance;">Your first nector moment is <em>on us.</em></h1>
        <p data-reveal style="margin:0 auto 20px;max-width:28em;font-size:15px;line-height:1.65;color:var(--muted);text-wrap:pretty;">${esc(name ? `Thank you, ${name}.` : 'Thank you.')} You're helping us create a more thoughtful self-care experience, and we'd love to make your first nector moment special.</p>
        <div data-reveal class="offer-card">
          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 14px 0;">
            <p class="serif" style="margin:0;font-size:24px;line-height:1.25;max-width:16em;">${esc(OFFER.benefit)}</p>
            <div class="code"><span style="font-size:11px;letter-spacing:0.2em;color:var(--muted);">YOUR CODE</span><b>${esc(OFFER.code)}</b></div>
            <button type="button" id="copy" class="btn-outline" data-act="copy">Copy code</button>
            <div id="copy-status" role="status" aria-live="polite" style="font-size:13px;min-height:18px;"></div>
            <p style="margin:0;font-size:12.5px;line-height:1.55;color:var(--muted);max-width:26em;">${esc(OFFER.terms)}</p>
          </div>
        </div>
        <div data-reveal style="margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px;">
          <button type="button" class="btn" style="padding:0 32px;" data-act="discover">Discover your nector experience</button>
          <button type="button" class="link" data-act="restart">Start over</button>
        </div>
      </div>
    </section>`;
  }

  function vSoon() {
    const valid = PHONE_RE.test(S.phone);
    const masked = valid ? '+91 ' + S.phone.slice(0, 5) + ' ' + S.phone.slice(5) : '';
    const msg = valid
      ? `nector is putting the finishing touches on your first experience. We'll send a note to ${masked} as soon as bookings open, so your code is ready when you are.`
      : `nector is putting the finishing touches on your first experience. Keep your code handy — it'll be ready for your first booking as soon as we open.`;
    return `<section class="split soon">
      <div class="split-media"><div class="frame">${img(IMG.soon)}</div></div>
      <div class="split-copy" style="gap:24px;">
        <div data-reveal>${logo(34)}</div>
        <div data-reveal class="chip"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;"></span><span style="white-space:nowrap;">COMING SOON</span></div>
        <h1 data-reveal tabindex="-1" class="serif" style="margin:0;font-size:clamp(40px,6.4vw,72px);line-height:1.02;letter-spacing:-0.02em;text-wrap:balance;">We'll let you know the moment we're <em>live.</em></h1>
        <p data-reveal class="lede" style="line-height:1.65;">${esc(msg)}</p>
        <div data-reveal class="codebox">
          <span style="font-size:13px;color:var(--muted);">Your code</span>
          <span style="font-size:18px;font-weight:500;letter-spacing:0.18em;">${esc(OFFER.code)}</span>
          <span style="margin-left:auto;font-size:13px;color:var(--muted);">${S.codeCopied ? 'Copied ✓' : ''}</span>
        </div>
        <div data-reveal style="display:flex;flex-wrap:wrap;gap:12px;">
          <button type="button" class="btn-outline" data-act="offer">Back to my offer</button>
          <button type="button" class="link" style="min-height:52px;padding:0 26px;font-size:14px;" data-act="restart">Start over</button>
        </div>
      </div>
    </section>`;
  }

  // ---------- render ----------
  function render() {
    const st = S.step;
    let body;
    if (st === 'welcome') body = vWelcome();
    else if (st === 'contact') body = vContact();
    else if (st === 'branch') body = vBranch();
    else if (QUESTIONS[st]) body = vQuestion(st);
    else if (st === 'offer') body = vOffer();
    else body = vSoon();
    app.innerHTML = header() + `<main id="screen">${body}</main>`;
    window.scrollTo(0, 0);

    if (st === 'contact') { bindContact(); updatePhoneError(); }
    if (QUESTIONS[st]) updateQuestionFooter();

    const screen = $('#screen');
    if (!reduced && screen.animate) screen.animate([{ opacity: 0, transform: `translateY(${dir * 14}px)` }, { opacity: 1, transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.2,.7,.2,1)' });
    const h = screen.querySelector('h1');
    if (h && st !== 'welcome') h.focus({ preventScroll: true });
    if (st === 'welcome') enter('[data-enter]', 0);
    if (st === 'offer' || st === 'soon') enter('[data-reveal]', 120);
    if (st === 'offer') petals();
  }

  function enter(sel, base) {
    if (reduced) return;
    app.querySelectorAll(sel).forEach((e, i) => e.animate && e.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: base + i * 90, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'backwards' }));
  }
  function petals() {
    if (reduced) return;
    app.querySelectorAll('[data-petal]').forEach((e, i) => e.animate && e.animate([
      { opacity: 0, transform: 'translateY(20px) scale(.5)' },
      { opacity: 0.85, offset: 0.25 },
      { opacity: 0, transform: `translate(${(i % 2 ? 1 : -1) * 14}px,-160px) scale(1)` }
    ], { duration: 2600 + (i % 3) * 500, delay: 500 + i * 160, easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'both' }));
  }

  // ---------- partial updates ----------
  function updatePhoneError() {
    const err = phoneError();
    const show = (S.phoneTouched || S.submitted) && err;
    $('#nector-phone-err').textContent = show || '';
    $('#phone-box').classList.toggle('bad', !!show);
    $('#nector-phone').setAttribute('aria-invalid', show ? 'true' : 'false');
  }

  function bindContact() {
    $('#nector-name').addEventListener('input', e => { S.firstName = e.target.value.slice(0, 40); });
    const ph = $('#nector-phone');
    ph.addEventListener('input', e => {
      let d = e.target.value.replace(/\D/g, '');
      if (d.length > 10 && d.startsWith('91')) d = d.slice(2);
      if (d.length > 10 && d.startsWith('0')) d = d.slice(1);
      S.phone = d.slice(0, 10);
      if (e.target.value !== S.phone) e.target.value = S.phone;
      updatePhoneError();
    });
    ph.addEventListener('blur', () => { S.phoneTouched = true; updatePhoneError(); });
    $('#nector-consent').addEventListener('change', e => { S.consent = e.target.checked; });
    $('#contact').addEventListener('submit', e => {
      e.preventDefault();
      S.submitted = true;
      updatePhoneError();
      if (!phoneError()) next(); else ph.focus();
    });
  }

  function updateQuestionFooter() {
    const s = seq(), idx = s.indexOf(S.step);
    const q = QUESTIONS[S.step];
    const count = (S.answers[q.field] || []).length;
    $('#qhint').textContent = count ? count + ' selected' : '';
    const btn = $('#qnext');
    btn.textContent = s[idx + 1] === 'offer' && count > 0 ? 'See my treat' : 'Next';
    btn.classList.toggle('on', count > 0);
  }

  function selectOption(id) {
    const q = QUESTIONS[S.step];
    const cur = S.answers[q.field] || [];
    let val;
    if (cur.includes(id)) val = cur.filter(x => x !== id);
    else if (id === q.exclusive) val = [id];
    else val = [...cur.filter(x => x !== q.exclusive), id];
    S.answers[q.field] = val;
    app.querySelectorAll('.opt').forEach(b => {
      const on = val.includes(b.dataset.opt);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
      b.querySelector('.mk').textContent = on ? '✓' : '';
    });
    updateQuestionFooter();
  }

  function chooseBranch(b) {
    S.branch = b;
    app.querySelectorAll('.card').forEach(c => {
      const on = c.dataset.branch === b;
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', on);
      c.querySelector('.mk').textContent = on ? '✓' : '';
    });
    clearTimeout(advT);
    advT = setTimeout(() => { if (S.step === 'branch') next(); }, 450);
  }

  function copyCode() {
    const done = () => {
      S.copied = true; S.codeCopied = true;
      const b = $('#copy'); if (b) { b.textContent = 'Code copied ✓'; b.classList.add('on'); }
      const st = $('#copy-status'); if (st) st.textContent = 'Code is copied to your clipboard.';
      clearTimeout(copyT);
      copyT = setTimeout(() => { if (S.step === 'offer') go('soon', 1); }, 1500);
    };
    const fallback = () => {
      const t = document.createElement('textarea'); t.value = OFFER.code; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(OFFER.code).then(done, fallback); else fallback();
  }

  // ---------- events ----------
  app.addEventListener('click', e => {
    const opt = e.target.closest('[data-opt]'); if (opt) return selectOption(opt.dataset.opt);
    const br = e.target.closest('[data-branch]'); if (br) return chooseBranch(br.dataset.branch);
    const a = e.target.closest('[data-act]'); if (!a) return;
    switch (a.dataset.act) {
      case 'begin': return go('contact', 1);
      case 'back': return back();
      case 'next': return next();
      case 'copy': return copyCode();
      case 'offer': return go('offer', -1);
      case 'restart': return restart();
      case 'discover': if (CTA_URL) { location.href = CTA_URL; return; } return go('soon', 1);
      case 'privacy': {
        S.showPrivacy = !S.showPrivacy;
        a.setAttribute('aria-expanded', S.showPrivacy);
        a.textContent = S.showPrivacy ? 'Hide privacy notice' : 'How we use your details';
        $('#nector-privacy').hidden = !S.showPrivacy;
        return;
      }
    }
  });

  render();
  flushPending();
})();
</script>
</body>
</html>
